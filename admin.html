<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勤務希望管理 - 管理者画面</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 15px; background: #f8f9fa; }
    header { display: flex; justify-content: space-between; align-items: center; background: #343a40; color: white; padding: 10px 20px; border-radius: 8px; margin-bottom: 15px; }
    .header-title { font-size: 18px; font-weight: bold; }

    /* メインタブ */
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid #dee2e6; }
    .nav-tab { padding: 10px 20px; font-weight: bold; cursor: pointer; border: none; background: none; font-size: 15px; color: #6c757d; }
    .nav-tab.active { color: #0066cc; border-bottom: 3px solid #0066cc; }

    .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }

    .btn-primary { background: #0066cc; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-success { background: #28a745; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-secondary { background: #6c757d; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
    .btn-danger { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }

    /* テーブル共通 */
    .table-container { overflow-x: auto; border: 1px solid #dee2e6; border-radius: 4px; }
    table { border-collapse: collapse; width: 100%; white-space: nowrap; font-size: 13px; }
    th, td { border: 1px solid #dee2e6; padding: 8px; text-align: center; }
    th { background: #f1f3f5; }

    /* モーダル */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 450px; }
    .form-group { margin-bottom: 12px; text-align: left; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 13px; }
    .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

    .status-badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
    .status-active { background: #e6fcf5; color: #0ca678; }
    .status-disabled { background: #fff5f5; color: #f03e3e; }
  </style>
</head>
<body>

  <header>
    <div class="header-title">勤務希望管理（管理者専用）</div>
    <button class="btn-danger" id="btn-logout">ログアウト</button>
  </header>

  <!-- メインタブ切り替え -->
  <div class="nav-tabs">
    <button class="nav-tab active" id="tab-shift-btn">📅 シフト集計・マトリックス</button>
    <button class="nav-tab" id="tab-staff-btn">👥 職員管理</button>
  </div>

  <!-- タブ1: シフト集計 -->
  <div id="tab-shift-view">
    <div class="card">
      <div class="toolbar">
        <div id="period-tabs" style="display:flex; gap:5px;"></div>
        <div>
          <button class="btn-success" id="btn-export-csv">📥 CSV出力</button>
        </div>
      </div>
      <div id="period-display" style="font-weight:bold; margin-bottom:10px;">対象期間: 読み込み中...</div>

      <div class="table-container">
        <table>
          <thead id="matrix-head"></thead>
          <tbody id="matrix-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- タブ2: 職員管理 -->
  <div id="tab-staff-view" style="display:none;">
    <div class="card">
      <div class="toolbar">
        <h3>登録職員一覧</h3>
        <button class="btn-primary" id="btn-open-staff-modal">＋ 新規職員追加</button>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>職員ID（ログインID）</th>
              <th>氏名</th>
              <th>表示名</th>
              <th>権限</th>
              <th>雇用形態</th>
              <th>アカウント状態</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="staff-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 職員登録・編集モーダル -->
  <div id="staff-modal" class="modal">
    <div class="modal-content">
      <h3 id="staff-modal-title" style="margin-top:0;">職員情報の登録</h3>
      
      <div class="form-group">
        <label>職員ID（ログインID）*</label>
        <input type="text" id="staff-input-id" placeholder="例: EMP001">
      </div>
      <div class="form-group">
        <label>氏名 *</label>
        <input type="text" id="staff-input-name" placeholder="例: 山田 太郎">
      </div>
      <div class="form-group">
        <label>表示名 *</label>
        <input type="text" id="staff-input-disp" placeholder="例: 山田">
      </div>
      <div class="form-group">
        <label>初期パスワード *</label>
        <input type="password" id="staff-input-pass" placeholder="ログイン用パスワード">
      </div>
      <div class="form-group">
        <label>権限</label>
        <select id="staff-input-role">
          <option value="staff">一般職員 (staff)</option>
          <option value="admin">管理者 (admin)</option>
        </select>
      </div>
      <div class="form-group">
        <label>雇用形態</label>
        <select id="staff-input-emp">
          <option value="常勤">常勤</option>
          <option value="パート">パート</option>
          <option value="夜勤専従">夜勤専従</option>
          <option value="その他">その他</option>
        </select>
      </div>
      <div class="form-group">
        <label>アカウント状態</label>
        <select id="staff-input-status">
          <option value="active">有効</option>
          <option value="disabled">無効（ログイン不可）</option>
        </select>
      </div>

      <div class="modal-actions">
        <button class="btn-secondary" id="btn-close-staff-modal">キャンセル</button>
        <button class="btn-primary" id="btn-save-staff">保存する</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { db, collection, doc, setDoc, getDocs, onSnapshot } from "./firebase-config.js";

    let staffList = [];
    let shiftData = {};
    let isEditMode = false;

    // 画面初期化
    window.addEventListener("DOMContentLoaded", () => {
      setupTabs();
      listenStaffs();
      listenShifts();
    });

    // タブ切替
    function setupTabs() {
      const shiftBtn = document.getElementById("tab-shift-btn");
      const staffBtn = document.getElementById("tab-staff-btn");
      const shiftView = document.getElementById("tab-shift-view");
      const staffView = document.getElementById("tab-staff-view");

      shiftBtn.onclick = () => {
        shiftBtn.classList.add("active");
        staffBtn.classList.remove("active");
        shiftView.style.display = "block";
        staffView.style.display = "none";
      };

      staffBtn.onclick = () => {
        staffBtn.classList.add("active");
        shiftBtn.classList.remove("active");
        staffView.style.display = "block";
        shiftView.style.display = "none";
      };
    }

    // 1. 職員データのリアルタイム読み込み
    function listenStaffs() {
      onSnapshot(collection(db, "users"), (snapshot) => {
        staffList = [];
        snapshot.forEach(docSnap => {
          staffList.push(docSnap.data());
        });
        renderStaffTable();
      });
    }

    // 職員テーブル描画
    function renderStaffTable() {
      const tbody = document.getElementById("staff-table-body");
      tbody.innerHTML = "";

      staffList.forEach(s => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>${s.staffId}</strong></td>
          <td>${s.name}</td>
          <td>${s.displayName}</td>
          <td>${s.role === 'admin' ? '管理者' : '一般'}</td>
          <td>${s.employmentType || '-'}</td>
          <td>
            <span class="status-badge ${s.status === 'active' ? 'status-active' : 'status-disabled'}">
              ${s.status === 'active' ? '有効' : '無効'}
            </span>
          </td>
          <td>
            <button class="btn-secondary" style="padding:3px 8px; font-size:11px;" onclick="openEditStaff('${s.staffId}')">編集</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 職員追加・編集モーダル処理
    document.getElementById("btn-open-staff-modal").onclick = () => {
      isEditMode = false;
      document.getElementById("staff-modal-title").innerText = "新規職員の追加";
      document.getElementById("staff-input-id").disabled = false;
      document.getElementById("staff-input-id").value = "";
      document.getElementById("staff-input-name").value = "";
      document.getElementById("staff-input-disp").value = "";
      document.getElementById("staff-input-pass").value = "";
      document.getElementById("staff-modal").style.display = "flex";
    };

    window.openEditStaff = (staffId) => {
      const target = staffList.find(s => s.staffId === staffId);
      if (!target) return;

      isEditMode = true;
      document.getElementById("staff-modal-title").innerText = "職員情報の編集";
      document.getElementById("staff-input-id").value = target.staffId;
      document.getElementById("staff-input-id").disabled = true; // ID変更不可
      document.getElementById("staff-input-name").value = target.name;
      document.getElementById("staff-input-disp").value = target.displayName;
      document.getElementById("staff-input-pass").value = target.password || "";
      document.getElementById("staff-input-role").value = target.role;
      document.getElementById("staff-input-emp").value = target.employmentType || "常勤";
      document.getElementById("staff-input-status").value = target.status || "active";

      document.getElementById("staff-modal").style.display = "flex";
    };

    document.getElementById("btn-close-staff-modal").onclick = () => {
      document.getElementById("staff-modal").style.display = "none";
    };

    // 職員情報保存
    document.getElementById("btn-save-staff").onclick = async () => {
      const staffId = document.getElementById("staff-input-id").value.trim();
      const name = document.getElementById("staff-input-name").value.trim();
      const displayName = document.getElementById("staff-input-disp").value.trim();
      const password = document.getElementById("staff-input-pass").value.trim();

      if (!staffId || !name || !displayName || !password) {
        alert("必須項目（職員ID、氏名、表示名、パスワード）を入力してください。");
        return;
      }

      const userData = {
        staffId: staffId,
        name: name,
        displayName: displayName,
        password: password,
        role: document.getElementById("staff-input-role").value,
        employmentType: document.getElementById("staff-input-emp").value,
        status: document.getElementById("staff-input-status").value,
        updatedAt: new Date()
      };

      try {
        await setDoc(doc(db, "users", staffId), userData, { merge: true });
        document.getElementById("staff-modal").style.display = "none";
        alert("職員情報を保存しました！");
      } catch (e) {
        alert("保存エラー: " + e.message);
      }
    };

    // 2. シフトデータの読み込み
    function listenShifts() {
      onSnapshot(collection(db, "shifts"), (snapshot) => {
        shiftData = {};
        snapshot.forEach(docSnap => {
          const d = docSnap.data();
          shiftData[`${d.date}_${d.staffId}`] = d;
        });
      });
    }

    // 3. CSVダウンロード機能
    document.getElementById("btn-export-csv").onclick = () => {
      if (Object.keys(shiftData).length === 0) {
        alert("出力できるシフトデータがありません。");
        return;
      }

      let csv = "\uFEFF"; // BOM (Excelでの文字化け防止)
      csv += "日付,職員ID,表示名,希望区分,備考\n";

      Object.values(shiftData).forEach(s => {
        const staff = staffList.find(u => u.staffId === s.staffId);
        const dispName = staff ? staff.displayName : s.staffId;
        const memo = (s.memo || "").replace(/"/g, '""'); // ダブルクォートのエスケープ

        csv += `"${s.date}","${s.staffId}","${dispName}","${s.type}","${memo}"\n`;
      });

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `シフト希望集計_${new Date().toISOString().split('T')[0]}.csv`;
      link.click();
    };
  </script>
</body>
</html>
