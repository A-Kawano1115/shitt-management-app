<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>勤務希望管理 - 職員・システム管理</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      padding: 15px;
      background-color: #f8f9fa;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .header-title { font-size: 18px; font-weight: bold; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .btn-nav {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
    }
    .btn-logout {
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    .container {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; }
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .card-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #0f172a;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 8px;
    }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }
    .form-control {
      width: 100%;
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
    }
    .btn-submit {
      width: 100%;
      background: #10b981;
      color: white;
      border: none;
      padding: 10px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-submit:hover { background: #059669; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 10px;
      text-align: left;
    }
    th { background: #f1f5f9; font-weight: bold; }
    .role-badge {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }
    .role-admin { background: #dbeafe; color: #1e40af; }
    .role-staff { background: #f3f4f6; color: #374151; }
    .btn-del-sm {
      background: #ef4444;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">勤務希望管理システム【管理者専用】</div>
    <div class="header-actions">
      <a href="app.html" class="btn-nav">カレンダー画面へ</a>
      <button id="btn-logout" class="btn-logout">ログアウト</button>
    </div>
  </header>

  <div class="container">
    <!-- 職員追加フォーム -->
    <div class="card">
      <div class="card-title">新規職員アカウント作成</div>
      <form id="add-staff-form">
        <div class="form-group">
          <label for="staff-id">スタッフID (例: 1002)</label>
          <input type="text" id="staff-id" class="form-control" required placeholder="半角英数字">
        </div>
        <div class="form-group">
          <label for="staff-name">氏名 (例: 山田 太郎)</label>
          <input type="text" id="staff-name" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="password">初期パスワード</label>
          <input type="password" id="password" class="form-control" required minlength="6" placeholder="6文字以上">
        </div>
        <div class="form-group">
          <label for="role">権限</label>
          <select id="role" class="form-control">
            <option value="staff">一般スタッフ</option>
            <option value="admin">管理者</option>
          </select>
        </div>
        <button type="submit" id="btn-create" class="btn-submit">登録実行</button>
      </form>
    </div>

    <!-- 職員一覧表示 -->
    <div class="card">
      <div class="card-title">登録済み職員一覧</div>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>氏名</th>
            <th>権限</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="staff-table-body">
          <tr><td colspan="4">読み込み中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ↓↓↓ ここにapp.htmlと同じfirebaseConfigを貼り付けてください ↓↓↓
    const firebaseConfig = {
      apiKey: "AIzaSyBRC4LFi5zqFTtDZtrsAEFSs99F1nlnPYA",
      authDomain: "shift-app-2026-ddb1a.firebaseapp.com",
      projectId: "shift-app-2026-ddb1a",
      storageBucket: "shift-app-2026-ddb1a.firebasestorage.app",
      messagingSenderId: "645356176933",
      appId: "1:645356176933:web:2a01952e35d9382d4961cc"
    };
    // ↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUserId = "";

    // 認証状態の監視
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUserId = user.email.replace("@shift.local", "");
        
        // 管理者権限チェック
        const userDoc = await getDoc(doc(db, "users", currentUserId));
        if (!userDoc.exists() || userDoc.data().role !== "admin") {
          alert("管理者権限がありません。カレンダー画面に移動します。");
          window.location.href = "app.html";
          return;
        }

        // 職員一覧をリアルタイム読み込み
        listenStaffList();
      } else {
        window.location.href = "index.html";
      }
    });

    // ログアウト処理
    document.getElementById("btn-logout").addEventListener("click", () => {
      signOut(auth).then(() => { window.location.href = "index.html"; });
    });

    // 職員追加処理
    document.getElementById("add-staff-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const staffId = document.getElementById("staff-id").value.trim();
      const name = document.getElementById("staff-name").value.trim();
      const password = document.getElementById("password").value;
      const role = document.getElementById("role").value;
      const btn = document.getElementById("btn-create");

      btn.disabled = true;
      btn.textContent = "登録中...";

      try {
        // 管理者セッションを維持するため、一時的なFirebaseアプリを立ち上げてアカウント作成
        const tempApp = initializeApp(firebaseConfig, "SecondaryApp");
        const tempAuth = getAuth(tempApp);
        
        const email = `${staffId}@shift.local`;
        const cred = await createUserWithEmailAndPassword(tempAuth, email, password);

        // Firestore の users コレクションに保存
        await setDoc(doc(db, "users", staffId), {
          uid: cred.user.uid,
          staffId: staffId,
          name: name,
          role: role,
          createdAt: new Date()
        });

        alert(`職員「${name} (${staffId})」を登録しました！`);
        document.getElementById("add-staff-form").reset();
      } catch (error) {
        console.error("登録エラー:", error);
        alert("登録に失敗しました: " + error.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "登録実行";
      }
    });

    // 職員一覧のリアルタイム表示
    function listenStaffList() {
      onSnapshot(collection(db, "users"), (snapshot) => {
        const tbody = document.getElementById("staff-table-body");
        tbody.innerHTML = "";

        if (snapshot.empty) {
          tbody.innerHTML = '<tr><td colspan="4">登録されている職員はいません</td></tr>';
          return;
        }

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const tr = document.createElement("tr");

          const roleClass = data.role === "admin" ? "role-admin" : "role-staff";
          const roleLabel = data.role === "admin" ? "管理者" : "一般";

          tr.innerHTML = `
            <td><strong>${data.staffId}</strong></td>
            <td>${data.name || "-"}</td>
            <td><span class="role-badge ${roleClass}">${roleLabel}</span></td>
            <td>
              <button class="btn-del-sm" onclick="deleteStaff('${data.staffId}')">削除</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      });
    }

    // 職員削除処理
    window.deleteStaff = async function(staffId) {
      if (!confirm(`スタッフID: ${staffId} の登録情報をFirestoreから削除しますか？\n(※注意: Authenticationのアカウント削除は別途Firebaseコンソールで行う必要があります)`)) return;

      try {
        await deleteDoc(doc(db, "users", staffId));
        alert("Firestoreの職員データを削除しました。");
      } catch (e) {
        alert("削除エラー: " + e.message);
      }
    };
  </script>
</body>
</html>
