<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>管理者画面 - 勤務希望管理</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #f8f9fa;
      color: #333;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #343a40;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .header-title { font-size: 18px; font-weight: bold; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    
    .btn-userpage {
      background: #17a2b8;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-userpage:hover { background: #138496; }

    .btn-logout {
      background: #dc3545;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-logout:hover { background: #bd2130; }

    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 14px;
    }
    select, input[type="text"] {
      width: 100%;
      max-width: 400px;
      padding: 8px 12px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .btn-primary {
      background: #28a745;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }
    .btn-primary:hover { background: #218838; }

    .help-text {
      font-size: 12px;
      color: #6c757d;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">管理者専用パネル</div>
    <div class="header-actions">
      <span id="admin-display" style="font-size:14px;">---</span>
      <button id="btn-userpage" class="btn-userpage">カレンダー画面へ</button>
      <button id="btn-logout" class="btn-logout">ログアウト</button>
    </div>
  </header>

  <div class="card">
    <h2>CSV出力設定</h2>
    <p style="font-size:14px; color:#555; margin-bottom: 20px;">
      指定した対象期間の全職員の希望データを集計し、Shift作成ソフト取り込み用のCSVファイルをダウンロードします。
    </p>

    <div class="form-group">
      <label for="period-select">出力対象期間:</label>
      <select id="period-select"></select>
      <div class="help-text">※初期状態では毎月の提出対象期間（20日締）が自動選択されています。</div>
    </div>

    <button id="btn-download-csv" class="btn-primary">CSVをダウンロード</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, collection, doc, getDoc, getDocs 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ↓↓ ご自身の Firebase 設定コードを貼り付けてください ↓↓
    const firebaseConfig = {
      apiKey: "AIzaSyBRC4LFi5zqFTtDZtrsAEFSs99F1nlnPYA",
      authDomain: "shift-app-2026-ddb1a.firebaseapp.com",
      projectId: "shift-app-2026-ddb1a",
      storageBucket: "shift-app-2026-ddb1a.firebasestorage.app",
      messagingSenderId: "645356176933",
      appId: "1:645356176933:web:2a01952e35d9382d4961cc"
    };
    // ↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentAdminId = "";
    let periodList = [];
    let usersNameMap = {}; // { staffId: displayName }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentAdminId = user.email.replace("@shift.local", "");
        
        // 管理者権限チェック
        const isAdmin = await checkAdminRole(currentAdminId);
        if (!isAdmin) {
          alert("管理者権限がありません。");
          window.location.href = "app.html";
          return;
        }

        await loadUsersNameMap();
        const displayName = usersNameMap[currentAdminId] || currentAdminId;
        document.getElementById("admin-display").textContent = `管理者: ${displayName}`;

        initAdminView();
      } else {
        window.location.href = "index.html";
      }
    });

    async function checkAdminRole(staffId) {
      try {
        const userDoc = await getDoc(doc(db, "users", staffId));
        return userDoc.exists() && userDoc.data().role === "admin";
      } catch (e) {
        console.error("権限確認エラー:", e);
        return false;
      }
    }

    async function loadUsersNameMap() {
      try {
        const snap = await getDocs(collection(db, "users"));
        snap.forEach(docSnap => {
          const data = docSnap.data();
          usersNameMap[docSnap.id] = data.displayName || docSnap.id;
        });
      } catch (e) {
        console.warn("ユーザー情報取得失敗", e);
      }
    }

    document.getElementById("btn-userpage").addEventListener("click", () => {
      window.location.href = "app.html";
    });

    document.getElementById("btn-logout").addEventListener("click", () => {
      signOut(auth).then(() => { window.location.href = "index.html"; });
    });

    // 期間リストの生成（当期を初期選択に自動設定）
    function generatePeriodOptions() {
      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth();
      const day = today.getDate();

      // 当月20日までは「翌月16日〜（baseOffset=2）」
      // 21日以降は「翌々月16日〜（baseOffset=3）」
      const baseOffset = (day > 20) ? 3 : 2;
      const labels = ["前期", "当期（締め対象）", "翌期", "翌々期"];
      const periods = [];

      for (let i = -1; i <= 2; i++) {
        const offset = baseOffset + i;
        const startDate = new Date(year, month + offset - 1, 16);
        const endDate = new Date(year, month + offset, 15);

        const dates = [];
        let curr = new Date(startDate);
        while (curr <= endDate) {
          const y = curr.getFullYear();
          const m = String(curr.getMonth() + 1).padStart(2, '0');
          const d = String(curr.getDate()).padStart(2, '0');
          dates.push(`${y}-${m}-${d}`);
          curr.setDate(curr.getDate() + 1);
        }

        periods.push({
          isDefault: (i === 0), // 当期をデフォルトフラグにする
          shortLabel: labels[i + 1],
          dates: dates,
          startStr: dates[0],
          endStr: dates[dates.length - 1]
        });
      }
      return periods;
    }

    function initAdminView() {
      periodList = generatePeriodOptions();
      const selectEl = document.getElementById("period-select");
      selectEl.innerHTML = "";

      periodList.forEach((p, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = `[${p.shortLabel}] ${p.startStr} 〜 ${p.endStr}`;
        if (p.isDefault) {
          opt.selected = true; // デフォルト設定（8月20日までは9/16〜期間）
        }
        selectEl.appendChild(opt);
      });
    }

    // CSVダウンロード処理
    document.getElementById("btn-download-csv").addEventListener("click", async () => {
      const selectedIndex = document.getElementById("period-select").value;
      const targetPeriod = periodList[selectedIndex];

      try {
        const snapshot = await getDocs(collection(db, "shifts"));
        const shiftsData = {};

        // 取得データの絞り込み
        snapshot.forEach(docSnap => {
          const data = docSnap.data();
          if (targetPeriod.dates.includes(data.date)) {
            if (!shiftsData[data.date]) shiftsData[data.date] = [];
            shiftsData[data.date].push(data);
          }
        });

        // CSV文字列生成 (BOM付き UTF-8)
        let csvContent = "\uFEFF日付,職員ID,職員名,希望区分,備考\n";

        targetPeriod.dates.forEach(dStr => {
          const dayShifts = shiftsData[dStr] || [];
          dayShifts.forEach(s => {
            const name = usersNameMap[s.staffId] || s.staffId;
            const memoEscaped = (s.memo || "").replace(/"/g, '""');
            csvContent += `"${dStr}","${s.staffId}","${name}","${s.type}","${memoEscaped}"\n`;
          });
        });

        // Blobを作成してダウンロード実行
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `shift_requests_${targetPeriod.startStr}_${targetPeriod.endStr}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

      } catch (e) {
        alert("CSVダウンロード失敗: " + e.message);
      }
    });
  </script>
</body>
</html>
