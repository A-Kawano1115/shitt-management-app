<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>勤務希望入力カレンダー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 15px;
      background-color: #f8f9fa;
      color: #333;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .header-title { font-size: 18px; font-weight: bold; }
    .user-info { font-size: 13px; color: #cbd5e1; margin-right: 10px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    
    .btn-admin {
      display: none; /* 管理者のみJSで表示 */
      background: #3b82f6;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
    }
    .btn-admin:hover { background: #2563eb; }
    
    .btn-logout {
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-logout:hover { background: #dc2626; }

    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .period-selector {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .period-selector label { font-weight: bold; font-size: 14px; }
    .period-selector select {
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background-color: white;
    }

    .notice-bar {
      background: #eff6ff;
      border-left: 4px solid #3b82f6;
      padding: 10px 15px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #1e40af;
      border-radius: 0 4px 4px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      background: white;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 10px;
      text-align: center;
      font-size: 14px;
    }
    th { background: #f1f5f9; font-weight: bold; }
    .sat { color: #2563eb; background: #eff6ff; }
    .sun { color: #dc2626; background: #fef2f2; }

    select.shift-select {
      width: 100%;
      padding: 6px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 14px;
    }

    .btn-save {
      background: #10b981;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      display: block;
      width: 100%;
      max-width: 200px;
      margin: 0 auto;
    }
    .btn-save:hover { background: #059669; }
    .btn-save:disabled { background: #9ca3af; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="header-title">勤務希望入力カレンダー</div>
    <div class="header-actions">
      <span id="user-display-name" class="user-info">読み込み中...</span>
      
      <!-- 管理者のみ表示されるボタン -->
      <a id="btn-admin" href="admin.html" class="btn-admin">⚙ 管理画面</a>
      
      <button id="btn-logout" class="btn-logout">ログアウト</button>
    </div>
  </header>

  <div class="card">
    <!-- 対象期間選択 -->
    <div class="period-selector">
      <label for="target-period">表示期間:</label>
      <select id="target-period">
        <!-- JSで動的に選択肢（前期間〜翌々期間）を生成します -->
      </select>
    </div>

    <div id="notice-deadline" class="notice-bar">
      毎月20日締め切り（翌日21日朝6:00以降は変更できません）
    </div>

    <!-- シフト入力用テーブル -->
    <form id="shift-form">
      <table>
        <thead>
          <tr>
            <th style="width: 120px;">日付</th>
            <th style="width: 80px;">曜日</th>
            <th>希望シフト</th>
            <th>備考・連絡事項</th>
          </tr>
        </thead>
        <tbody id="calendar-body">
          <tr><td colspan="4" style="padding: 20px;">データ読み込み中...</td></tr>
        </tbody>
      </table>

      <button type="submit" id="btn-save-shift" class="btn-save">希望を保存</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ↓↓↓ ここにご自身の firebaseConfig を貼り付けてください ↓↓↓
    const firebaseConfig = {
      apiKey: "AIzaSyBRC4LFi5zqFTtDZtrsAEFSs99F1nlnPYA",
      authDomain: "shift-app-2026-ddb1a.firebaseapp.com",
      projectId: "shift-app-2026-ddb1a",
      storageBucket: "shift-app-2026-ddb1a.firebasestorage.app",
      messagingSenderId: "645356176933",
      appId: "1:645356176933:web:2a01952e35d9382d4961cc"
    };
    // ↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUserId = "";
    let currentUserData = null;

    // 認証状態の監視
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUserId = user.email.replace("@shift.local", "");

        try {
          // Firestoreからユーザー情報を取得
          const userDoc = await getDoc(doc(db, "users", currentUserId));
          if (userDoc.exists()) {
            currentUserData = userDoc.data();
            const displayName = currentUserData.displayName || currentUserData.name || currentUserId;
            document.getElementById("user-display-name").textContent = `${displayName} 様 (${currentUserId})`;

            // 管理者の場合は「⚙ 管理画面」ボタンを表示
            if (currentUserData.role === "admin") {
              document.getElementById("btn-admin").style.display = "inline-block";
            }
          } else {
            document.getElementById("user-display-name").textContent = `ID: ${currentUserId}`;
          }

          // 期間選択ドロップダウンの初期化とカレンダー描画
          initPeriodSelector();
          loadCalendar();

        } catch (error) {
          console.error("ユーザー情報取得エラー:", error);
        }

      } else {
        window.location.href = "index.html";
      }
    });

    // ログアウト処理
    document.getElementById("btn-logout").addEventListener("click", () => {
      signOut(auth).then(() => { window.location.href = "index.html"; });
    });

    // 締め切りルール（20日締め）に基づくベース月算定
    function getBaseTargetDate(now) {
      const year = now.getFullYear();
      const month = now.getMonth(); // 0-indexed (6 = 7月)
      const day = now.getDate();

      // 20日以前なら「翌月16日開始分」、21日以降なら「翌々月16日開始分」が対象
      if (day <= 20) {
        return new Date(year, month + 1, 16);
      } else {
        return new Date(year, month + 2, 16);
      }
    }

    // 期間選択ドロップダウンの生成（前期間1つ + 当期間(デフォルト) + 翌期間 + 翌々期間 の計4期間）
    function initPeriodSelector() {
      const select = document.getElementById("target-period");
      select.innerHTML = "";
      
      const now = new Date();
      const baseDate = getBaseTargetDate(now); // 例: 7/26なら 9/16開始分

      // i = -1 (前期間), 0 (当期間/デフォルト), 1 (翌期間), 2 (翌々期間)
      for (let i = -1; i <= 2; i++) {
        const startD = new Date(baseDate.getFullYear(), baseDate.getMonth() + i, 16);
        const endD = new Date(startD.getFullYear(), startD.getMonth() + 1, 15);

        const startY = startD.getFullYear();
        const startM = startD.getMonth() + 1;
        const endY = endD.getFullYear();
        const endM = endD.getMonth() + 1;

        const val = `${startY}-${String(startM).padStart(2, '0')}`;
        const label = `${startY}年${startM}月16日 〜 ${endY}年${endM}月15日分`;

        const opt = document.createElement("option");
        opt.value = val;
        opt.textContent = label;
        
        // i === 0 (当期間) をデフォルト選択
        if (i === 0) opt.selected = true;
        select.appendChild(opt);
      }

      select.addEventListener("change", loadCalendar);
    }

    // カレンダーテーブルの生成と既存データの読み込み
    async function loadCalendar() {
      const periodVal = document.getElementById("target-period").value;
      const tbody = document.getElementById("calendar-body");
      tbody.innerHTML = '<tr><td colspan="4" style="padding:20px;">読み込み中...</td></tr>';

      // 選択された期間の開始日（16日）と終了日（翌月15日）を算出
      const [year, month] = periodVal.split("-").map(Number);
      const startDate = new Date(year, month - 1, 16);
      const endDate = new Date(year, month, 15);

      // Firestore から既存のシフト希望データを取得
      const shiftDocId = `${currentUserId}_${periodVal}`;
      let savedShifts = {};
      try {
        const shiftSnap = await getDoc(doc(db, "shifts", shiftDocId));
        if (shiftSnap.exists()) {
          savedShifts = shiftSnap.data().days || {};
        }
      } catch (e) {
        console.error("シフトデータ読み込みエラー:", e);
      }

      // テーブル行の生成
      tbody.innerHTML = "";
      const dayNames = ["日", "月", "火", "水", "木", "金", "土"];
      let curr = new Date(startDate);

      while (curr <= endDate) {
        const dateStr = `${curr.getFullYear()}-${String(curr.getMonth() + 1).padStart(2, '0')}-${String(curr.getDate()).padStart(2, '0')}`;
        const dayOfWeek = curr.getDay();
        const dayClass = dayOfWeek === 6 ? "sat" : dayOfWeek === 0 ? "sun" : "";
        const saved = savedShifts[dateStr] || { shift: "", note: "" };

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${curr.getMonth() + 1}/${curr.getDate()}</td>
          <td class="${dayClass}">${dayNames[dayOfWeek]}</td>
          <td>
            <select class="shift-select" data-date="${dateStr}">
              <option value="" ${saved.shift === "" ? "selected" : ""}>-- 選択 --</option>
              <option value="日勤" ${saved.shift === "日勤" ? "selected" : ""}>日勤</option>
              <option value="早番" ${saved.shift === "早番" ? "selected" : ""}>早番</option>
              <option value="遅番" ${saved.shift === "遅番" ? "selected" : ""}>遅番</option>
              <option value="夜勤" ${saved.shift === "夜勤" ? "selected" : ""}>夜勤</option>
              <option value="希望休" ${saved.shift === "希望休" ? "selected" : ""}>希望休</option>
            </select>
          </td>
          <td>
            <input type="text" class="shift-note" data-date="${dateStr}" value="${saved.note || ''}" style="width:100%; padding:6px; border:1px solid #cbd5e1; border-radius:4px;" placeholder="備考">
          </td>
        `;
        tbody.appendChild(tr);

        // 次の日へ
        curr.setDate(curr.getDate() + 1);
      }
    }

    // シフト希望の保存処理
    document.getElementById("shift-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const periodVal = document.getElementById("target-period").value;
      const shiftDocId = `${currentUserId}_${periodVal}`;
      const btn = document.getElementById("btn-save-shift");

      const selects = document.querySelectorAll(".shift-select");

      const daysData = {};
      selects.forEach((sel) => {
        const dateStr = sel.getAttribute("data-date");
        const noteInput = document.querySelector(`.shift-note[data-date="${dateStr}"]`);
        daysData[dateStr] = {
          shift: sel.value,
          note: noteInput ? noteInput.value.trim() : ""
        };
      });

      btn.disabled = true;
      btn.textContent = "保存中...";

      try {
        await setDoc(doc(db, "shifts", shiftDocId), {
          staffId: currentUserId,
          period: periodVal,
          days: daysData,
          updatedAt: new Date()
        });

        alert("希望シフトを保存しました！");
      } catch (error) {
        console.error("保存エラー:", error);
        alert("保存に失敗しました: " + error.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "希望を保存";
      }
    });
  </script>
</body>
</html>
